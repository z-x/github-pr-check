name: Release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub Release.
# Run manually (Actions tab → Release → Run workflow) to only build; binaries land in the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # Static musl Linux binaries are cross-compiled with zig as the C compiler/linker (needed by ring).
      - uses: actions/setup-python@v7
        if: matrix.zig
        with:
          python-version: "3.x"
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name="github-pr-check-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/github-pr-check.exe" "dist/$name/"
            # Files at the zip root, so the exe path inside stays the same across versions (winget manifest points at it).
            (cd "dist/$name" && 7z a "../$name.zip" * > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/github-pr-check" "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: github-pr-check-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Opens a PR on microsoft/winget-pkgs updating z-x.GitHubPRCheck to the new version.
  # Skipped until the WINGET_TOKEN secret exists (see "Publishing to winget" in the README), and for pre-release tags.
  winget:
    name: Submit to winget
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: z-x.GitHubPRCheck
          release-tag: ${{ github.ref_name }}
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  # Rewrites Formula/github-pr-check.rb in z-x/homebrew-tap with the new version's URLs and checksums.
  # Skipped until the HOMEBREW_TAP_TOKEN secret exists, and for pre-release tags.
  homebrew:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''

      - name: Update formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/z-x/homebrew-tap.git" tap
          bash .github/scripts/homebrew-formula.sh "$version" SHA256SUMS.txt > tap/Formula/github-pr-check.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "github-pr-check $version"
          git push

  # Uses crates.io trusted publishing (no token): configure it once on the crate's settings page.
  crates:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml version $version doesn't match tag $GITHUB_REF_NAME"; exit 1; }

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
